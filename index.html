<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Vestí a la muñequita</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="escenario">

    <!-- PANTALLA 1: INICIO -->
    <section id="pantalla-inicio" class="pantalla activa">
      <img class="fondo" src="pantalladeinicio.png" alt="">
      <img id="botjugar" class="elemento" src="botjugar.png" alt="Jugar">
    </section>

    <!-- PANTALLA 2: VESTIR -->
    <section id="pantalla-vestir" class="pantalla">
      <img class="fondo" src="pantallavestir.png" alt="">
      <img id="doll" class="elemento" src="doll1.png" alt="Muñequita">
      <div id="brillos"></div>

      <img id="botfruti"  class="elemento boton-outfit" src="botfruti.png"  data-doll="doll4.png" alt="Outfit 1">
      <img id="botboca"   class="elemento boton-outfit" src="botboca.png"   data-doll="doll5.png" alt="Outfit 2">
      <img id="botgira"   class="elemento boton-outfit" src="botgira.png"   data-doll="doll3.png" alt="Outfit 3">
      <img id="botsnupi"  class="elemento boton-outfit" src="botsnupi.png"  data-doll="doll2.png" alt="Outfit 4">

      <img id="flecha" class="elemento oculto" src="flecha.png" alt="Siguiente">
    </section>

    <!-- PANTALLA 3: ELEGIR FONDO -->
    <section id="pantalla-fondo" class="pantalla">
      <img id="fondo-elegible" class="fondo" src="sinfondo.png" alt="">
      <img id="doll-fondo" class="elemento" src="doll1.png" alt="Muñequita">
      <div id="brillos-fondo"></div>

      <img id="botunqui" class="elemento boton-fondo" src="botunqui.png" data-fondo="unq.png"              alt="Fondo 1">
      <img id="botmuni"  class="elemento boton-fondo" src="botmuni.png"  data-fondo="lasfloresymitre.png"   alt="Fondo 2">
      <img id="botchino" class="elemento boton-fondo" src="botchino.png" data-fondo="barriochinom.png"      alt="Fondo 3">

      <img id="flecha-fondo" class="elemento oculto" src="flecha.png" alt="Siguiente">

      <!-- Cartelito de instrucciones: fijo durante toda esta pantalla -->
      <img id="instruccion" src="instruccion.png" alt="Instrucciones">
    </section>

    <!-- PANTALLA 4: FINAL -->
    <section id="pantalla-final" class="pantalla">
      <img id="fondo-final" class="fondo" src="fondo1.png" alt="">
      <img id="doll-final" class="elemento" src="doll1.png" alt="Muñequita elegida">

      <!-- Cartel de instrucción final: borde superior, centrado -->
      <img id="instruccion-final" src="instruccionfinal.png" alt="Instrucciones">

      <img id="jugardenuevo" class="elemento" src="jugardenuevo.png" alt="Jugar de nuevo">
    </section>

  </div>

  <script src="script.js"></script>
</body>
</html>
